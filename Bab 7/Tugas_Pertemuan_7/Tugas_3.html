<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tugas 3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg-main: #f8fafc;
    --surface: #ffffff;
    --text-dark: #0f172a;
    --text-light: #64748b;
    --border-color: #e2e8f0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 60px 20px;
  }

  .fade-in-section {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .fade-in-section h1 {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .fade-in-section p {
    color: var(--text-light);
  }

  .grid-container {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
  }

  .card-container {
    background-color: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  .card-container h2 {
    font-size: 1.1rem;
    color: var(--text-dark);
    margin-bottom: 30px;
    font-weight: 500;
  }

  .btn {
    width: 100%;
    padding: 12px 24px;
    margin-bottom: 15px;
    border: none;
    border-radius: 8px;
    background-color: var(--surface);
    color: var(--text-dark);
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border-color);
  }

  .btn:last-child {
    margin-bottom: 0;
  }

  .btn-color {
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .btn-color:hover {
    background-color: var(--primary);
    color: var(--surface);
    border-color: var(--primary);
  }

  .btn-scale {
    transition: transform 0.3s ease;
    background-color: var(--primary);
    color: var(--surface);
    border-color: var(--primary);
  }

  .btn-scale:hover {
    transform: scale(1.05);
  }

  .btn-shadow {
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }

  .btn-shadow:hover {
    box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    transform: translateY(-2px);
    border-color: var(--primary);
    color: var(--primary);
  }

  .spinner {
    width: 60px;
    height: 60px;
    border: 4px solid var(--border-color);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  .flip-scene {
    perspective: 1000px;
    width: 100%;
    height: 200px;
  }

  .flip-object {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .flip-scene:hover .flip-object {
    transform: rotateY(180deg);
  }

  .flip-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 500;
  }

  .flip-front {
    background-color: var(--bg-main);
    color: var(--text-dark);
    border: 2px dashed var(--border-color);
  }

  .flip-back {
    background-color: var(--primary);
    color: var(--surface);
    transform: rotateY(180deg);
  }

</style>
</head>
<body>

<div class="fade-in-section">
  <h1>Elemen Interaktif</h1>
</div>

<div class="grid-container">
  
  <div class="card-container">
    <h2>Button Transitions</h2>
    <button class="btn btn-color">Color Fade</button>
    <button class="btn btn-scale">Scale Transform</button>
    <button class="btn btn-shadow">Shadow Elevation</button>
  </div>

  <div class="card-container">
    <h2>Loading Spinner</h2>
    <div class="spinner"></div>
  </div>

  <div class="card-container">
    <h2>Flip Card</h2>
    <div class="flip-scene">
      <div class="flip-object">
        <div class="flip-face flip-front">
          Arahkan Kursor Kesini
        </div>
        <div class="flip-face flip-back">
          Sisi Belakang Kartu
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
