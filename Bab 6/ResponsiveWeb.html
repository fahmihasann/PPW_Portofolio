<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Responsive Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-header-bg: #1e4d2b;
      --color-header-text: #d4eed9;
      --color-nav-link: #a8d5b5;
      --color-nav-link-hover: #ffffff;
      --color-body-bg: #f8f6f0;
      --color-body-text: #3a4a42;
      --color-hero-text: #0d1a12;
      --color-card-bg: #696969;
      --color-card-text: #ffffff;
      --color-card-hover-bg: #575757;
      --color-footer-bg: #0a1a10;
      --color-footer-text: #a8d5b5;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Source Sans 3', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-body-bg);
      color: var(--color-body-text);
      font-size: 16px;
      line-height: 1.6;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background-color: var(--color-header-bg);
      color: var(--color-header-text);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    nav ul li a {
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--color-nav-link);
      letter-spacing: 0.03em;
    }

    nav ul li a:hover,
    nav ul li a.active {
      color: var(--color-nav-link-hover);
    }

    .hero {
      text-align: center;
      padding: 40px 24px 0;
      background-color: #fff;
    }

    .hero h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--color-hero-text);
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 0.95rem;
      font-weight: 300;
      color: #666;
      margin-bottom: 24px;
    }

    .hero-image-wrapper {
      width: 100%;
      overflow: hidden;
    }

    .hero-image-wrapper img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      object-position: center;
    }

    .grid {
      display: flex;
      gap: 4px;
      padding: 4px;
      background-color: #f0ebe4;
    }

    .card {
      flex: 1;
      background-color: var(--color-card-bg);
      color: var(--color-card-text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 18px 12px;
    }

    .card:hover {
      background-color: var(--color-card-hover-bg);
    }

    footer {
      background-color: var(--color-footer-bg);
      color: var(--color-footer-text);
      text-align: center;
      padding: 20px 24px;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.03em;
    }


    @media (max-width: 768px) {

      header {
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 18px 24px;
        text-align: center;
      }

      header h1 {
        font-size: 1.15rem;
      }

      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      nav ul li a {
        font-size: 0.9rem;
      }

      .hero {
        padding: 32px 20px 0;
      }

      .hero h2 {
        font-size: 1.5rem;
      }

      .hero p {
        font-size: 0.9rem;
      }

      .hero-image-wrapper img {
        height: 300px;
      }

      .grid {
        flex-wrap: wrap;
      }

      .card {
        flex: 1 1 calc(33% - 8px);
      }
    }

    @media (max-width: 480px) {

      header {
        padding: 16px;
      }

      header h1 {
        font-size: 1rem;
      }

      .hero {
        padding: 24px 16px 0;
      }

      .hero h2 {
        font-size: 1.25rem;
      }

      .hero p {
        font-size: 0.85rem;
        margin-bottom: 18px;
      }

      .hero-image-wrapper img {
        height: 240px;
      }

      .grid {
        flex-direction: column;
        gap: 4px;
        padding: 4px;
      }

      .card {
        flex: 1 1 100%;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>My Responsive Website</h1>
    <nav>
      <ul>
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h2>Welcome to My Site</h2>
      <p>This is a fully responsive webpage.</p>

      <div class="hero-image-wrapper">
        <img
          src="https://picsum.photos/1200/500"
          alt="Hero Image"
        />
      </div>
    </section>

    <section class="grid">
      <div class="card">Card 1</div>
      <div class="card">Card 2</div>
      <div class="card">Card 3</div>
    </section>

  </main>

  <footer>
    <p>&copy; 2025 My Responsive Website. All rights reserved.</p>
  </footer>

</body>
</html>
