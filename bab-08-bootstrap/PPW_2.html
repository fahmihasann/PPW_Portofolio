<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Bootstrap 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5 mb-5">
    <h2 class="mb-4 text-center">Formulir Pendaftaran Mahasiswa Baru</h2>

    <div class="alert alert-success alert-dismissible fade show d-none shadow-sm" id="alertSukses" role="alert">
        Berhasil! Data pendaftaran mahasiswa baru telah disimpan.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form id="formPendaftaran">
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="namaLengkap" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control is-valid" id="namaLengkap" required>
                        <div class="valid-feedback">
                          Format nama terlihat sesuai.
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="nim" class="form-label">NIM</label>
                        <input type="text" class="form-control is-invalid" id="nim" required>
                        <div class="invalid-feedback">
                          NIM berupa angka.
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="namaemail@gmail.com" required>
                </div>

                <div class="mb-3">
                    <label for="programStudi" class="form-label">Program Studi</label>
                    <select class="form-select" id="programStudi" required>
                        <option value="" selected disabled>Pilih Program Studi...</option>
                        <option value="Teknik Informatika">Teknik Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Ilmu Komputer">Ilmu Komputer</option>
                        <option value="Manajemen Bisnis">Teknologi Rekayasa Perangkat Lunak</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="semester" class="form-label">Semester</label>
                    <select class="form-select" id="semester" required>
                        <option value="" selected disabled>Pilih Semester saat ini...</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="alamat" class="form-label">Alamat Lengkap</label>
                    <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat domisili lengkap..." required></textarea>
                </div>

                <div class="mb-4">
                    <label for="fotoProfil" class="form-label">Foto Profil</label>
                    <input class="form-control" type="file" id="fotoProfil" accept="image/*" required>
                </div>

                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-primary px-4">Simpan</button>
                    <button type="reset" class="btn btn-outline-secondary px-4" onclick="document.getElementById('alertSukses').classList.add('d-none')">Reset</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('formPendaftaran').addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        const alertBox = document.getElementById('alertSukses');
        alertBox.classList.remove('d-none');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>

</body>
</html>
